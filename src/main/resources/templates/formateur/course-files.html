<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fichiers du Cours - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link" th:href="@{/formateur/courses/{id}(id=${course.id})}">Retour au cours</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="mb-4">
            <a th:href="@{/formateur/courses/{id}(id=${course.id})}" class="btn btn-outline-secondary mb-3">
                <i class="bi bi-arrow-left me-2"></i>Retour au cours
            </a>
            <h2><i class="bi bi-folder-fill me-2"></i>Fichiers - <span th:text="${course.titre}"></span></h2>
        </div>
        
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <!-- Formulaire d'upload -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-cloud-upload me-2"></i>Ajouter un fichier</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/formateur/courses/{id}/files/upload(id=${course.id})}" 
                      method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Fichier</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description (optionnel)</label>
                        <textarea class="form-control" id="description" name="description" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-upload me-2"></i>Uploader le fichier
                    </button>
                </form>
            </div>
        </div>
        
        <!-- Liste des fichiers -->
        <div class="card">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0"><i class="bi bi-files me-2"></i>Fichiers du cours</h5>
            </div>
            <div class="card-body">
                <div th:if="${files != null and !files.isEmpty()}">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Nom du fichier</th>
                                    <th>Description</th>
                                    <th>Taille</th>
                                    <th>Date d'upload</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="file : ${files}">
                                    <td>
                                        <i class="bi bi-file-earmark me-2"></i>
                                        <span th:text="${file.originalFileName}"></span>
                                    </td>
                                    <td th:text="${file.description != null ? file.description : '-'}"></td>
                                    <td>
                                        <span th:text="${#numbers.formatDecimal(file.fileSize / 1024.0, 1, 2)} + ' Ko'"></span>
                                    </td>
                                    <td th:text="${#temporals.format(file.uploadDate, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/formateur/courses/{courseId}/files/{fileId}/download(courseId=${course.id}, fileId=${file.id})}" 
                                           class="btn btn-sm btn-primary me-2">
                                            <i class="bi bi-download me-1"></i>Télécharger
                                        </a>
                                        <form th:action="@{/formateur/courses/{courseId}/files/{fileId}/delete(courseId=${course.id}, fileId=${file.id})}" 
                                              method="post" style="display: inline;">
                                            <button type="submit" class="btn btn-sm btn-danger" 
                                                    onclick="return confirm('Êtes-vous sûr de vouloir supprimer ce fichier ?');">
                                                <i class="bi bi-trash me-1"></i>Supprimer
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div th:if="${files == null or files.isEmpty()}" class="alert alert-info mb-0">
                    <i class="bi bi-info-circle me-2"></i>
                    Aucun fichier disponible pour ce cours.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
