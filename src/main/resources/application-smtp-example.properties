# ============================================
# VARIABLES D'ENVIRONNEMENT (Recommandé pour la production)
# ============================================
# Utilisez des variables d'environnement au lieu de hardcoder les valeurs:
#
# Linux/Mac:
# export SPRING_MAIL_HOST=smtp.gmail.com
# export SPRING_MAIL_PORT=587
# export SPRING_MAIL_USERNAME=votre_email@gmail.com
# export SPRING_MAIL_PASSWORD=votre_mot_de_passe
#
# Windows PowerShell:
# $env:SPRING_MAIL_HOST="smtp.gmail.com"
# $env:SPRING_MAIL_PORT="587"
# $env:SPRING_MAIL_USERNAME="votre_email@gmail.com"
# $env:SPRING_MAIL_PASSWORD="votre_mot_de_passe"
#
# Puis dans votre fichier de configuration:
#spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
#spring.mail.port=${SPRING_MAIL_PORT:587}
#spring.mail.username=${SPRING_MAIL_USERNAME:}
#spring.mail.password=${SPRING_MAIL_PASSWORD:}

