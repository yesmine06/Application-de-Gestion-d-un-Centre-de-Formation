<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Séances - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/formateur/dashboard">
                <i class="bi bi-mortarboard"></i> Gestion Formation
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/dashboard">Dashboard</a>
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link active" href="/formateur/schedules">Mes Séances</a>
                <a class="nav-link" href="/logout">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-calendar3"></i> Mes Séances Planifiées</h1>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <div th:if="${schedules != null and !schedules.isEmpty()}">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Cours</th>
                                <th>Date</th>
                                <th>Heure</th>
                                <th>Salle</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="schedule : ${schedules}">
                                <td>
                                    <strong th:text="${schedule.cours.titre}"></strong><br>
                                    <small class="text-muted" th:text="${schedule.cours.code}"></small>
                                </td>
                                <td th:text="${#temporals.format(schedule.date, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <span th:text="${#temporals.format(schedule.heureDebut, 'HH:mm')} + ' - ' + ${#temporals.format(schedule.heureFin, 'HH:mm')}"></span>
                                </td>
                                <td th:text="${schedule.salle != null ? schedule.salle : '-'}"></td>
                                <td>
                                    <span th:switch="${schedule.status != null ? schedule.status.toString() : ''}">
                                        <span th:case="'PENDING'" class="badge bg-warning">En attente</span>
                                        <span th:case="'APPROVED'" class="badge bg-success">Approuvé</span>
                                        <span th:case="'REJECTED'" class="badge bg-danger">Rejeté</span>
                                        <span th:case="*" class="badge bg-secondary">-</span>
                                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/formateur/schedules/{id}/edit(id=${schedule.id})}" 
                                       class="btn btn-sm btn-warning">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/formateur/courses/{id}/schedules/new(id=${schedule.cours.id})}" 
                                       class="btn btn-sm btn-primary">
                                        <i class="bi bi-plus-circle"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:if="${schedules == null or schedules.isEmpty()}" class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    Aucune séance planifiée. <a th:href="@{/formateur/courses}">Créer une séance</a> pour un de vos cours.
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
