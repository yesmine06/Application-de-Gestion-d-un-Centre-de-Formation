<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Gestion Formation</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/courses">Retour</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${course != null and course.id != null} ? 'Modifier Cours' : 'Nouveau Cours'">Nouveau Cours</h1>

        <form th:action="${(course != null and course.id != null) ? '/admin/courses/' + course.id : '/admin/courses'}" 
              th:object="${course}" method="post" class="card p-4">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            
            <div class="mb-3">
                <label for="code" class="form-label">Code</label>
                <input type="text" class="form-control" id="code" th:field="*{code}" required>
            </div>
            <div class="mb-3">
                <label for="titre" class="form-label">Titre</label>
                <input type="text" class="form-control" id="titre" th:field="*{titre}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label for="formateurId" class="form-label">Formateur</label>
                <select class="form-select" id="formateurId" name="formateurId" required>
                    <option value="">Sélectionner un formateur</option>
                    <option th:each="trainer : ${trainers}" 
                            th:value="${trainer.id}" 
                            th:text="${trainer.nom + ' ' + trainer.prenom}"
                            th:selected="${course != null and course.formateur != null and course.formateur.id != null and course.formateur.id == trainer.id}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="sessionId" class="form-label">Session</label>
                <select class="form-select" id="sessionId" name="sessionId">
                    <option value="">Sélectionner une session</option>
                    <option th:each="sessionItem : ${sessions}" 
                            th:value="${sessionItem.id}" 
                            th:text="${sessionItem.nom}"
                            th:selected="${course != null and course.session != null and course.session.id != null and course.session.id == sessionItem.id}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="/admin/courses" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
