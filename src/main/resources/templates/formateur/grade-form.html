<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribuer une note - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/grades">Retour aux notes</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-clipboard-check me-2"></i>Attribuer une note</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
                        </div>
                        
                        <form th:action="@{/formateur/grades/save}" method="post">
                            <!-- Sélection du cours -->
                            <div class="mb-3">
                                <label for="courseId" class="form-label">Cours <span class="text-danger">*</span></label>
                                <select class="form-select" id="courseId" name="courseId" required onchange="loadStudents()">
                                    <option value="">Sélectionner un cours</option>
                                    <option th:each="course : ${courses}" 
                                            th:value="${course.id}" 
                                            th:text="${course.code + ' - ' + course.titre}"
                                            th:selected="${courseId != null and courseId == course.id}"></option>
                                </select>
                            </div>
                            
                            <!-- Sélection de l'étudiant -->
                            <div class="mb-3" id="studentSelectDiv" th:if="${courseId != null}">
                                <label for="studentId" class="form-label">Étudiant <span class="text-danger">*</span></label>
                                <select class="form-select" id="studentId" name="studentId" required>
                                    <option value="">Sélectionner un étudiant</option>
                                    <option th:each="student : ${students}" 
                                            th:value="${student.id}" 
                                            th:text="${student.matricule + ' - ' + student.nom + ' ' + student.prenom}"
                                            th:selected="${studentId != null and studentId == student.id}"></option>
                                </select>
                            </div>
                            
                            <!-- Note -->
                            <div class="mb-3">
                                <label for="valeur" class="form-label">Note (sur 20) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="valeur" name="valeur" 
                                       min="0" max="20" step="0.01" required>
                                <div class="form-text">Entrez une note entre 0 et 20</div>
                            </div>
                            
                            <!-- Commentaire -->
                            <div class="mb-3">
                                <label for="commentaire" class="form-label">Commentaire</label>
                                <textarea class="form-control" id="commentaire" name="commentaire" rows="3" 
                                          placeholder="Commentaire optionnel sur la note"></textarea>
                            </div>
                            
                            <div class="d-flex justify-content-between">
                                <a href="/formateur/grades" class="btn btn-secondary">
                                    <i class="bi bi-arrow-left me-2"></i>Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle me-2"></i>Enregistrer la note
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadStudents() {
            var courseId = document.getElementById('courseId').value;
            if (courseId) {
                window.location.href = '/formateur/grades/new?courseId=' + courseId;
            }
        }
    </script>
</body>
</html>
