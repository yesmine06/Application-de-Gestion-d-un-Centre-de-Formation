<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateur - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Gestion Formation</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/trainers">Retour</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${trainer != null && trainer.id != null} ? 'Modifier Formateur' : 'Nouveau Formateur'"></h1>

        <!-- Formulaire de création avec RegistrationDto -->
        <form th:if="${registrationDto != null}" 
              th:action="@{/admin/trainers}" 
              th:object="${registrationDto}" method="post" class="card p-4">
            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
            </div>
            <div class="mb-3">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" th:field="*{prenom}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label for="specialite" class="form-label">Spécialité</label>
                <input type="text" class="form-control" id="specialite" th:field="*{specialite}" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" required>
            </div>
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i> Un mot de passe sécurisé sera généré automatiquement et envoyé par email au formateur.
            </div>
            <button type="submit" class="btn btn-primary">Créer le formateur</button>
            <a href="/admin/trainers" class="btn btn-secondary">Annuler</a>
        </form>

        <!-- Formulaire de modification avec Trainer -->
        <form th:if="${trainer != null && trainer.id != null}" 
              th:action="@{/admin/trainers/{id}(id=${trainer.id})}" 
              th:object="${trainer}" method="post" class="card p-4">
            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
            </div>
            <div class="mb-3">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" th:field="*{prenom}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label for="specialite" class="form-label">Spécialité</label>
                <input type="text" class="form-control" id="specialite" th:field="*{specialite}" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" th:field="*{password}">
                <small class="form-text text-muted">Laisser vide pour ne pas modifier</small>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="/admin/trainers" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
