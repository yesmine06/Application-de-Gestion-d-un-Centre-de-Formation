<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id != null} ? 'Modifier Étudiant' : 'Nouvel Étudiant'">Étudiant - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Gestion Formation</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/students">Retour</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${student.id != null} ? 'Modifier Étudiant' : 'Nouvel Étudiant'"></h1>

        <form th:action="${student.id != null ? '/admin/students/' + student.id : '/admin/students'}" 
              th:object="${student}" method="post" class="card p-4">
            <div class="mb-3">
                <label for="matricule" class="form-label">Matricule</label>
                <input type="text" class="form-control" id="matricule" th:field="*{matricule}" required>
            </div>
            <div class="mb-3">
                <label for="nom" class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
            </div>
            <div class="mb-3">
                <label for="prenom" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" th:field="*{prenom}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">Nom d'utilisateur</label>
                <input type="text" class="form-control" id="username" th:field="*{username}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="password" th:field="*{password}">
                <small class="form-text text-muted">Laisser vide pour ne pas modifier</small>
            </div>
            <div class="mb-3">
                <label for="specialty" class="form-label">Spécialité</label>
                <select class="form-select" id="specialty" th:field="*{specialty}">
                    <option value="">Sélectionner une spécialité</option>
                    <option th:each="spec : ${specialties}" 
                            th:value="${spec.id}" 
                            th:text="${spec.nom}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="group" class="form-label">Groupe</label>
                <select class="form-select" id="group" th:field="*{group}">
                    <option value="">Sélectionner un groupe</option>
                    <option th:each="grp : ${groups}" 
                            th:value="${grp.id}" 
                            th:text="${grp.nom}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="/admin/students" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
