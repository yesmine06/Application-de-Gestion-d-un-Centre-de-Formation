<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${session.id != null} ? 'Modifier Session' : 'Nouvelle Session'">Session - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Gestion Formation</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/sessions">Retour</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1 th:text="${session.id != null} ? 'Modifier Session' : 'Nouvelle Session'"></h1>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="${session.id != null ? '/admin/sessions/' + session.id : '/admin/sessions'}" 
              th:object="${session}" method="post" class="card p-4">
            <div class="mb-3">
                <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
            </div>
            <div class="mb-3">
                <label for="dateDebut" class="form-label">Date de début <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dateDebut" th:field="*{dateDebut}" required>
            </div>
            <div class="mb-3">
                <label for="dateFin" class="form-label">Date de fin <span class="text-danger">*</span></label>
                <input type="date" class="form-control" id="dateFin" th:field="*{dateFin}" required>
            </div>
            <div class="mb-3">
                <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
                <select class="form-select" id="type" th:field="*{type}" required>
                    <option value="">Sélectionner un type</option>
                    <option th:each="type : ${sessionTypes}" 
                            th:value="${type}" 
                            th:text="${type.name() == 'SEMESTRE' ? 'Semestre' : 'Année scolaire'}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
            <a href="/admin/sessions" class="btn btn-secondary">Annuler</a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
