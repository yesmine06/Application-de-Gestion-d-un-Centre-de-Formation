# Production Profile - MySQL Database
# Note: Activate this profile using: -Dspring-boot.run.profiles=prod

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/formation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mail Configuration (Production)
# Note: Pour Gmail, vous devez:
# 1. Activer l'authentification à 2 facteurs
# 2. Créer un "Mot de passe d'application" (App Password) depuis https://myaccount.google.com/apppasswords
# 3. Utiliser ce mot de passe d'application au lieu de votre mot de passe Gmail normal
# IMPORTANT: Utilisez des variables d'environnement pour les credentials sensibles
# Exemple: export SPRING_MAIL_USERNAME=votre_email@gmail.com
#          export SPRING_MAIL_PASSWORD=votre_mot_de_passe
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Si le mot de passe contient des espaces, vous pouvez l'entourer de guillemets dans certaines configurations


