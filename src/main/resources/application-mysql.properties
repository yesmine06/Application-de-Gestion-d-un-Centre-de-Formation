# MySQL Database Configuration (XAMPP - Port 3307)
# Note: Activate this profile using: -Dspring-boot.run.profiles=mysql

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/formation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Mail Configuration (Mock)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

