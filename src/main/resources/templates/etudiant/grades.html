<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Notes - Étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/etudiant/dashboard">
                <i class="bi bi-mortarboard me-2"></i>Gestion Formation - Étudiant
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/etudiant/dashboard">Dashboard</a>
                <a class="nav-link" href="/etudiant/courses">Mes Cours</a>
                <a class="nav-link active" href="/etudiant/grades">Mes Notes</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-clipboard-check me-2"></i>Mes Notes</h2>
            <div th:if="${average != null}" class="text-center">
                <h4 class="text-primary mb-0">Moyenne générale</h4>
                <h2 class="text-primary" th:text="${#numbers.formatDecimal(average, 1, 2)} + '/20'"></h2>
            </div>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <div th:if="${grades != null and !grades.isEmpty()}">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Cours</th>
                                    <th>Code</th>
                                    <th>Formateur</th>
                                    <th>Note</th>
                                    <th>Commentaire</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="grade : ${grades}">
                                    <td>
                                        <strong th:text="${grade.cours.titre}"></strong>
                                    </td>
                                    <td th:text="${grade.cours.code}"></td>
                                    <td th:text="${grade.cours.formateur != null ? grade.cours.formateur.nom + ' ' + grade.cours.formateur.prenom : 'N/A'}"></td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${grade.valeur >= 10} ? 'bg-success' : 'bg-danger'"
                                              style="font-size: 1.1rem; padding: 0.5rem 1rem;"
                                              th:text="${grade.valeur} + '/20'"></span>
                                    </td>
                                    <td>
                                        <span th:text="${grade.commentaire != null ? grade.commentaire : '-'}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(grade.dateAttribution, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/etudiant/courses/{id}(id=${grade.cours.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye me-1"></i>Voir cours
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${grades == null or grades.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            Vous n'avez aucune note pour le moment.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
