# Application Configuration
spring.application.name=gestion-formation
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Default Database Configuration (MySQL - XAMPP Port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/formation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly disable H2 console and auto-configuration
spring.h2.console.enabled=false

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# IMPORTANT: En production, utilisez une variable d'environnement pour le secret JWT
# Exemple: export JWT_SECRET=votre_secret_tres_long_et_securise
jwt.secret=${JWT_SECRET:MySecretKeyForJWTTokenGeneration123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
# Les niveaux de logging sont configurés dans logback-spring.xml selon le profil
# Par défaut (développement): DEBUG pour voir les détails
# Production: INFO/WARN pour les performances
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_SQL_BINDER:TRACE}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SpringDoc OpenAPI (Swagger) Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Mail Configuration
# ==================
# En développement, par défaut, le service utilise un mock qui log les emails dans la console
# Pour activer l'envoi réel d'emails, configurez les propriétés ci-dessous

# Configuration SMTP (désactivée par défaut en développement)
# Décommentez et configurez pour activer l'envoi d'emails
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=votre_email@gmail.com
#spring.mail.password=votre_mot_de_passe_application
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true
#spring.mail.properties.mail.smtp.connectiontimeout=5000
#spring.mail.properties.mail.smtp.timeout=5000
#spring.mail.properties.mail.smtp.writetimeout=5000

# Configuration par défaut (mock - pour développement)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

# Logging pour EmailService
logging.level.com.formation.service.EmailService=INFO

# CORS Configuration
# Liste des origines autorisées (séparées par des virgules)
# En production, spécifiez uniquement les domaines autorisés
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.metrics.export.prometheus.enabled=false

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=users,students,courses,trainers,specialties,groups,sessions,statistics

# Database Connection Pool Configuration (HikariCP)
# HikariCP est le pool de connexions par défaut de Spring Boot
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=FormationHikariPool

