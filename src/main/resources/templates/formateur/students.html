<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Étudiants - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/dashboard">Dashboard</a>
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link active" href="/formateur/students">Mes Étudiants</a>
                <a class="nav-link" href="/formateur/grades">Notes</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people me-2"></i>Mes Étudiants</h2>
            <span class="badge bg-primary fs-6" th:text="${students.size()} + ' étudiants'"></span>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <div th:if="${students != null and !students.isEmpty()}">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Matricule</th>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Email</th>
                                    <th>Spécialité</th>
                                    <th>Groupe</th>
                                    <th>Date d'inscription</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="student : ${students}">
                                    <td th:text="${student.matricule}"></td>
                                    <td th:text="${student.nom}"></td>
                                    <td th:text="${student.prenom}"></td>
                                    <td th:text="${student.email}"></td>
                                    <td>
                                        <span th:if="${student.specialty != null}" th:text="${student.specialty.nom}"></span>
                                        <span th:if="${student.specialty == null}" class="text-muted">-</span>
                                    </td>
                                    <td>
                                        <span th:if="${student.group != null}" th:text="${student.group.nom}"></span>
                                        <span th:if="${student.group == null}" class="text-muted">-</span>
                                    </td>
                                    <td th:text="${#temporals.format(student.dateInscription, 'dd/MM/yyyy')}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${students == null or students.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            Vous n'avez aucun étudiant dans vos cours pour le moment.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
