<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau Cours - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="mb-4">
            <a href="/formateur/courses" class="btn btn-outline-secondary mb-3">
                <i class="bi bi-arrow-left me-2"></i>Retour aux cours
            </a>
            <h2><i class="bi bi-plus-circle me-2"></i>Créer un nouveau cours</h2>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <form th:action="@{/formateur/courses}" th:object="${course}" method="post" class="card p-4">
            <div class="mb-3">
                <label for="code" class="form-label">Code du cours <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="code" th:field="*{code}" required>
                <small class="form-text text-muted">Code unique pour identifier le cours</small>
            </div>
            
            <div class="mb-3">
                <label for="titre" class="form-label">Titre <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="titre" th:field="*{titre}" required>
            </div>
            
            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
            </div>
            
            <div class="mb-3">
                <label for="sessionId" class="form-label">Session</label>
                <select class="form-select" id="sessionId" name="sessionId">
                    <option value="">Sélectionner une session (optionnel)</option>
                    <option th:each="sessionItem : ${sessions}" 
                            th:value="${sessionItem.id}" 
                            th:text="${sessionItem.nom}"></option>
                </select>
            </div>
            
            <div class="alert alert-info">
                <i class="bi bi-info-circle me-2"></i>
                Vous serez automatiquement assigné comme formateur de ce cours.
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-2"></i>Créer le cours
                </button>
                <a href="/formateur/courses" class="btn btn-secondary">
                    <i class="bi bi-x-circle me-2"></i>Annuler
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
