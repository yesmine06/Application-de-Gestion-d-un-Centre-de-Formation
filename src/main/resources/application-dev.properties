# Development Profile - MySQL (XAMPP Port 3307)
# Note: Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/formation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

