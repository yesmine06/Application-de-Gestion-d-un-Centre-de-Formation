<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/dashboard">Dashboard</a>
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link" href="/formateur/students">Mes Étudiants</a>
                <a class="nav-link active" href="/formateur/grades">Notes</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-clipboard-check me-2"></i>Gestion des Notes</h2>
            <a href="/formateur/grades/new" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>Attribuer une note
            </a>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>
        
        <!-- Filtre par cours -->
        <div class="card mb-4">
            <div class="card-body">
                <form method="get" action="/formateur/grades" class="row g-3">
                    <div class="col-md-4">
                        <label for="courseFilter" class="form-label">Filtrer par cours</label>
                        <select class="form-select" id="courseFilter" name="courseId" onchange="this.form.submit()">
                            <option value="">Tous les cours</option>
                            <option th:each="course : ${courses}" 
                                    th:value="${course.id}" 
                                    th:text="${course.code + ' - ' + course.titre}"
                                    th:selected="${selectedCourseId != null and selectedCourseId == course.id}"></option>
                        </select>
                    </div>
                </form>
            </div>
        </div>
        
        <div th:if="${grades != null and !grades.isEmpty()}">
            <div class="card">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Étudiant</th>
                                    <th>Matricule</th>
                                    <th>Cours</th>
                                    <th>Note</th>
                                    <th>Commentaire</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="grade : ${grades}">
                                    <td th:text="${grade.student.nom + ' ' + grade.student.prenom}"></td>
                                    <td th:text="${grade.student.matricule}"></td>
                                    <td>
                                        <strong th:text="${grade.cours.code}"></strong><br>
                                        <small class="text-muted" th:text="${grade.cours.titre}"></small>
                                    </td>
                                    <td>
                                        <span class="badge" 
                                              th:classappend="${grade.valeur >= 10} ? 'bg-success' : 'bg-danger'"
                                              th:text="${grade.valeur}"></span>
                                    </td>
                                    <td>
                                        <span th:text="${grade.commentaire != null ? grade.commentaire : '-'}"></span>
                                    </td>
                                    <td th:text="${#temporals.format(grade.dateAttribution, 'dd/MM/yyyy HH:mm')}"></td>
                                    <td>
                                        <a th:href="@{/formateur/grades/new(courseId=${grade.cours.id}, studentId=${grade.student.id})}" 
                                           class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil me-1"></i>Modifier
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${grades == null or grades.isEmpty()}" class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            Aucune note attribuée pour le moment.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
