<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupes et Étudiants - Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .navbar-brand, .nav-link {
            color: white !important;
        }
        .group-card {
            margin-bottom: 2rem;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .group-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem;
            border-radius: 0.375rem 0.375rem 0 0;
        }
        .student-item {
            padding: 0.75rem;
            border-bottom: 1px solid #dee2e6;
        }
        .student-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/formateur/dashboard">
                <i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/formateur/dashboard">Dashboard</a>
                <a class="nav-link" href="/formateur/courses">Mes Cours</a>
                <a class="nav-link active" href="/formateur/groups">Groupes</a>
                <a class="nav-link" href="/formateur/students">Étudiants</a>
                <a class="nav-link" href="/logout">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-people me-2"></i>Groupes et Étudiants</h2>
            <a href="/formateur/dashboard" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>Retour au dashboard
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fermer"></button>
        </div>

        <div th:if="${groups != null and !groups.isEmpty()}">
            <div class="row">
                <div class="col-12" th:each="group : ${groups}">
                    <div class="card group-card">
                        <div class="group-header">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h5 class="mb-0">
                                        <i class="bi bi-collection me-2"></i>
                                        <span th:text="${group.nom}"></span>
                                    </h5>
                                    <small th:if="${group.description != null and !group.description.isEmpty()}" 
                                           th:text="${group.description}"></small>
                                </div>
                                <span class="badge bg-light text-dark">
                                    <span th:text="${groupStudentsMap != null and groupStudentsMap.get(group.id) != null ? groupStudentsMap.get(group.id).size() : 0}"></span>
                                    étudiant(s)
                                </span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div th:if="${groupStudentsMap != null and groupStudentsMap.get(group.id) != null and !groupStudentsMap.get(group.id).isEmpty()}">
                                <h6 class="mb-3">Étudiants du groupe :</h6>
                                <div class="list-group list-group-flush">
                                    <div class="student-item d-flex justify-content-between align-items-center" 
                                         th:each="student : ${groupStudentsMap.get(group.id)}">
                                        <div>
                                            <strong th:text="${student.nom + ' ' + student.prenom}"></strong>
                                            <br>
                                            <small class="text-muted">
                                                <i class="bi bi-person me-1"></i>
                                                <span th:text="${student.matricule}"></span>
                                                <span th:if="${student.email != null}">
                                                    | <i class="bi bi-envelope me-1"></i>
                                                    <span th:text="${student.email}"></span>
                                                </span>
                                                <span th:if="${student.specialty != null}">
                                                    | <i class="bi bi-book me-1"></i>
                                                    <span th:text="${student.specialty.nom}"></span>
                                                </span>
                                            </small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${groupStudentsMap == null or groupStudentsMap.get(group.id) == null or groupStudentsMap.get(group.id).isEmpty()}" 
                                 class="alert alert-info mb-0">
                                <i class="bi bi-info-circle me-2"></i>
                                Aucun étudiant dans ce groupe pour le moment.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${groups == null or groups.isEmpty()}" class="alert alert-info text-center py-5">
            <i class="bi bi-info-circle fs-1 d-block mb-3"></i>
            <h5>Aucun groupe disponible</h5>
            <p class="mb-0">Il n'y a pas de groupes dans le système pour le moment.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
