<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formateur - Gestion Formation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .main-content {
            min-height: 100vh;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-person-badge me-2"></i>Gestion Formation - Formateur</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" id="username-display"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                </button>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <!-- Login Page -->
        <div id="login-page" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4><i class="bi bi-person-badge me-2"></i>Connexion Formateur</h4>
                    </div>
                    <div class="card-body">
                        <div id="login-error" class="alert alert-danger d-none"></div>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="username" class="form-label">Nom d'utilisateur</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mot de passe</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Application -->
        <div id="app-content" class="d-none">
            <!-- Navigation Tabs -->
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link active" data-tab="courses" href="#" onclick="showTab('courses')">
                        <i class="bi bi-book me-2"></i>Mes Cours
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-tab="grades" href="#" onclick="showTab('grades')">
                        <i class="bi bi-clipboard-check me-2"></i>Gérer les Notes
                    </a>
                </li>
            </ul>

            <!-- Courses Tab -->
            <div id="courses-tab" class="tab-content">
                <h2 class="mb-4"><i class="bi bi-book me-2"></i>Mes Cours</h2>
                <div id="courses-loading" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                </div>
                <div id="courses-list" class="row"></div>
                <div id="courses-empty" class="alert alert-info d-none">
                    <i class="bi bi-info-circle me-2"></i>Aucun cours assigné pour le moment.
                </div>
            </div>

            <!-- Grades Tab -->
            <div id="grades-tab" class="tab-content d-none">
                <h2 class="mb-4"><i class="bi bi-clipboard-check me-2"></i>Gérer les Notes</h2>
                <div class="card mb-4">
                    <div class="card-body">
                        <form id="grade-form">
                            <div class="row">
                                <div class="col-md-4">
                                    <label for="grade-course" class="form-label">Cours</label>
                                    <select class="form-select" id="grade-course" required></select>
                                </div>
                                <div class="col-md-4">
                                    <label for="grade-student" class="form-label">Étudiant</label>
                                    <select class="form-select" id="grade-student" required></select>
                                </div>
                                <div class="col-md-2">
                                    <label for="grade-value" class="form-label">Note (/20)</label>
                                    <input type="number" class="form-control" id="grade-value" min="0" max="20" step="0.5" required>
                                </div>
                                <div class="col-md-2 d-flex align-items-end">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <i class="bi bi-save me-1"></i>Enregistrer
                                    </button>
                                </div>
                            </div>
                            <div class="row mt-2">
                                <div class="col-md-12">
                                    <label for="grade-comment" class="form-label">Commentaire</label>
                                    <textarea class="form-control" id="grade-comment" rows="2"></textarea>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div id="grades-loading" class="text-center d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Chargement...</span>
                    </div>
                </div>
                <div id="grades-list"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/spa/formateur/app.js"></script>
</body>
</html>
